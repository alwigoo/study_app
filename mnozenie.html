<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EEF3FA">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✖️</text></svg>">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Tabliczka mnożenia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Lexend:wght@400;600&display=swap">
<style>
/* Layout: one phone column; first factor orange, second factor blue, result green, same everywhere */
:root {
  --bg: #EEF3FA;
  --card: #FFFFFF;
  --ink: #1B2540;
  --muted: #5B6785;
  --line: #D6DEEC;
  --a: #D2621C;  --a-soft: #FDEBDD;
  --b: #2F5FD0;  --b-soft: #E0E8FA;
  --res: #1E8A5F; --res-soft: #DDF3E9;
  --bad: #D0392F; --bad-soft: #FBE3E1;
  --on-color: #FFFFFF;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Lexend", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121827; --card: #1C2438; --ink: #EDF1F9; --muted: #9AA6C2; --line: #2C3752;
    --a: #FF9B5C; --a-soft: #3A2618;
    --b: #86A7FF; --b-soft: #1C2A4E;
    --res: #4FCB95; --res-soft: #173327;
    --bad: #FF7A70; --bad-soft: #3B1D1D;
    --on-color: #121827;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121827; --card: #1C2438; --ink: #EDF1F9; --muted: #9AA6C2; --line: #2C3752;
  --a: #FF9B5C; --a-soft: #3A2618;
  --b: #86A7FF; --b-soft: #1C2A4E;
  --res: #4FCB95; --res-soft: #173327;
  --bad: #FF7A70; --bad-soft: #3B1D1D;
  --on-color: #121827;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-inline: 16px; -webkit-tap-highlight-color: transparent;
  font-variant-numeric: tabular-nums;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 3px solid var(--b); outline-offset: 2px; }
.app { max-width: 520px; margin: 0 auto; padding-block: 14px 40px; display: flex; flex-direction: column; gap: 16px; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 1; margin: 0; }
h1 .x { color: var(--a); }
.sub { font-size: 14px; color: var(--muted); padding-bottom: 4px; text-align: right; }
.c-a { color: var(--a); } .c-b { color: var(--b); } .c-res { color: var(--res); }

.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 4px; gap: 4px; }
.tabs button { font-family: var(--font-display); font-weight: 800; font-size: 20px; padding: 8px 0 6px; border-radius: 12px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }

.label { font-family: var(--font-display); font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
.note { color: var(--muted); font-size: 14px; margin: 0; }

/* number picker 1–20 */
.nums { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.nums button { font-family: var(--font-display); font-weight: 800; font-size: 22px; padding: 8px 0 4px; border-radius: 12px; background: var(--card); border: 2px solid var(--line); }
.nums button[aria-pressed="true"] { background: var(--a); border-color: var(--a); color: var(--on-color); }

.seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { font-size: 14px; padding: 6px 12px; border-radius: 9px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* dot picture */
.picture { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.eq { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1.1; }
.dots { display: grid; gap: var(--gap); width: 100%; max-width: 360px; justify-content: center; }
.dots span { width: var(--d); height: var(--d); border-radius: 50%; background: var(--a); }
.dots span.alt { background: var(--b); }
.pic-note { font-size: 14px; color: var(--muted); text-align: center; }

.skip { display: flex; flex-wrap: wrap; gap: 5px; }
.skip span { background: var(--res-soft); color: var(--ink); border-radius: 8px; padding: 2px 8px; font-family: var(--font-display); font-weight: 800; font-size: 17px; }

.list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.list button { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; background: var(--card); border: 2px solid transparent; border-radius: 12px; padding: 8px 12px 6px; font-family: var(--font-display); font-weight: 800; font-size: 21px; text-align: left; }
.list button.active { border-color: var(--a); }
.list .r { color: var(--res); }
.list .r.hidden-r { color: var(--muted); }

.toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.toggle input { width: 20px; height: 20px; accent-color: var(--a); }

/* practice */
.progress { display: flex; gap: 5px; }
.progress span { flex: 1; height: 8px; border-radius: 4px; background: var(--line); }
.progress span.ok { background: var(--res); } .progress span.no { background: var(--bad); } .progress span.now { background: var(--muted); }

.q { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 20px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.task { font-family: var(--font-display); font-weight: 800; font-size: 52px; line-height: 1; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; justify-content: center; }
.task .op { color: var(--muted); }
.answer-box { min-width: 2.4ch; padding: 0 8px; border-bottom: 5px solid var(--muted); color: var(--ink); }
.answer-box.ok { color: var(--res); border-color: var(--res); }
.answer-box.no { color: var(--bad); border-color: var(--bad); text-decoration: line-through; }
.answer-box.empty { color: var(--line); }
.feedback { min-height: 28px; font-family: var(--font-display); font-weight: 800; font-size: 22px; }
.feedback.ok { color: var(--res); } .feedback.no { color: var(--bad); }
.help { width: 100%; background: var(--res-soft); border-radius: 14px; padding: 10px 12px; font-size: 15px; text-align: left; }
.help b { font-family: var(--font-display); font-size: 18px; }

.keypad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.keypad button { font-family: var(--font-display); font-weight: 800; font-size: 30px; padding: 12px 0 8px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 3px 0 var(--line); }
.keypad button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.keypad .ok-key { background: var(--res); border-color: var(--res); color: var(--on-color); box-shadow: 0 3px 0 rgba(0,0,0,.2); }
.keypad .del-key { color: var(--muted); }
.keypad button:disabled { opacity: .35; cursor: default; }

.big-btn { display: flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--font-display); font-weight: 800; font-size: 20px; padding: 12px 16px 10px; border-radius: 16px; background: var(--ink); color: var(--bg); width: 100%; }
.big-btn.ghost { background: var(--card); color: var(--ink); border: 2px solid var(--line); }
.big-btn:active { transform: scale(.98); }

.setup { display: flex; flex-direction: column; gap: 10px; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.quick button { font-size: 14px; padding: 6px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--muted); }

.result { text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.result .score { font-family: var(--font-display); font-weight: 800; font-size: 64px; line-height: 1; }
.stars { font-size: 26px; letter-spacing: 2px; color: var(--a); word-break: break-all; }
.stars .off { color: var(--line); }
.result .msg { font-family: var(--font-display); font-weight: 800; font-size: 26px; }
.review { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 6px; }
.review .skip span { background: var(--bad-soft); }

@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
.shake { animation: shake .35s; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="app">
  <header>
    <h1>7 <span class="x">×</span> 8 = ?</h1>
    <div class="sub">tabliczka<br>mnożenia 1–20</div>
  </header>

  <nav class="tabs" role="tablist">
    <button id="tab-learn" role="tab" aria-selected="true">Poznaj</button>
    <button id="tab-practice" role="tab" aria-selected="false">Ćwicz</button>
  </nav>

  <!-- LEARN -->
  <section id="learn" style="display:flex;flex-direction:column;gap:14px">
    <div class="label">Wybierz liczbę</div>
    <div class="nums" id="learn-nums"></div>

    <div class="picture" id="picture"></div>

    <div style="display:flex;flex-direction:column;gap:6px">
      <div class="label" id="skip-label">Liczymy co 7</div>
      <div class="skip" id="skip"></div>
    </div>

    <div class="bar">
      <label class="toggle" for="hide-results"><input type="checkbox" id="hide-results"> Zakryj wyniki</label>
      <div class="seg" id="learn-max">
        <button id="learn-max-10" data-max="10">do 10</button>
        <button id="learn-max-20" data-max="20">do 20</button>
      </div>
    </div>
    <div class="list" id="list"></div>
  </section>

  <!-- PRACTICE -->
  <section id="practice" hidden style="flex-direction:column;gap:14px">
    <div id="quiz" style="display:flex;flex-direction:column;gap:14px"></div>
  </section>
</div>

<script>
(function () {
  const store = {
    get(k, d) { try { const v = localStorage.getItem("mn-" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("mn-" + k, JSON.stringify(v)); } catch (e) {} }
  };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // ---------- sounds ----------
  let actx = null;
  function tones(freqs, dur, type) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      let t = actx.currentTime;
      freqs.forEach(f => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = type; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
        t += dur * 0.8;
      });
    } catch (e) {}
  }
  const ding = () => tones([660, 880], 0.16, "sine");
  const bonk = () => tones([200, 160], 0.18, "triangle");

  // ---------- tabs ----------
  const tabL = document.getElementById("tab-learn"), tabP = document.getElementById("tab-practice");
  const secL = document.getElementById("learn"), secP = document.getElementById("practice");
  function showTab(name) {
    const l = name === "learn";
    tabL.setAttribute("aria-selected", l); tabP.setAttribute("aria-selected", !l);
    secL.hidden = !l; secP.hidden = l;
    secP.style.display = l ? "" : "flex";
    store.set("tab", name);
  }
  tabL.onclick = () => showTab("learn");
  tabP.onclick = () => { showTab("practice"); if (!state) renderSetup(); };

  // ---------- dot picture ----------
  function drawPicture(box, a, b, note) {
    box.replaceChildren();
    const eq = el("div", "eq");
    eq.append(el("span", "c-a", a), document.createTextNode(" × "), el("span", "c-b", b), document.createTextNode(" = "), el("span", "c-res", a * b));
    box.appendChild(eq);
    const grid = el("div", "dots");
    const width = Math.min(box.clientWidth || 340, 360) - 28;
    const cell = Math.max(5, Math.min(26, Math.floor(width / b)));
    const gap = Math.max(2, Math.round(cell * 0.22));
    grid.style.setProperty("--d", (cell - gap) + "px");
    grid.style.setProperty("--gap", gap + "px");
    grid.style.gridTemplateColumns = "repeat(" + b + ", " + (cell - gap) + "px)";
    for (let r = 0; r < a; r++) for (let c = 0; c < b; c++) grid.appendChild(el("span", r % 2 ? "alt" : null));
    box.appendChild(grid);
    box.appendChild(el("div", "pic-note", note || (a + " " + rzedy(a) + " po " + b + " kropek")));
  }
  function rzedy(n) {
    if (n === 1) return "rząd";
    const d = n % 10, t = n % 100;
    return (d >= 2 && d <= 4 && !(t >= 12 && t <= 14)) ? "rzędy" : "rzędów";
  }

  // ---------- learn ----------
  let learnN = store.get("learnN", 7);
  let learnMax = store.get("learnMax", 10);
  let learnM = 3;
  let hide = false;
  const numsEl = document.getElementById("learn-nums");
  const listEl = document.getElementById("list");
  const picEl = document.getElementById("picture");
  const skipEl = document.getElementById("skip");
  const hideEl = document.getElementById("hide-results");
  hideEl.onchange = () => { hide = hideEl.checked; renderList(); };

  for (let n = 1; n <= 20; n++) {
    const b = el("button", null, n);
    b.id = "learn-n-" + n;
    b.onclick = () => { learnN = n; store.set("learnN", n); renderLearn(); };
    numsEl.appendChild(b);
  }
  const maxBtns = document.querySelectorAll("#learn-max button");
  maxBtns.forEach(b => b.onclick = () => { learnMax = Number(b.dataset.max); store.set("learnMax", learnMax); if (learnM > learnMax) learnM = learnMax; renderLearn(); });

  const revealed = new Set();
  function renderList() {
    listEl.replaceChildren();
    for (let m = 1; m <= learnMax; m++) {
      const b = el("button", m === learnM ? "active" : null);
      b.id = "row-" + m;
      const left = el("span");
      left.append(el("span", "c-a", learnN), document.createTextNode(" × "), el("span", "c-b", m));
      const show = !hide || revealed.has(m);
      const r = el("span", "r" + (show ? "" : " hidden-r"), show ? String(learnN * m) : "?");
      b.append(left, r);
      b.onclick = () => { learnM = m; if (hide) revealed.add(m); drawPicture(picEl, learnN, m); renderList(); };
      listEl.appendChild(b);
    }
  }
  function renderLearn() {
    numsEl.querySelectorAll("button").forEach((b, i) => b.setAttribute("aria-pressed", i + 1 === learnN));
    maxBtns.forEach(b => b.setAttribute("aria-pressed", Number(b.dataset.max) === learnMax));
    revealed.clear();
    document.getElementById("skip-label").textContent = learnN === 1 ? "Liczymy co 1" : "Liczymy co " + learnN;
    skipEl.replaceChildren();
    for (let m = 1; m <= learnMax; m++) skipEl.appendChild(el("span", null, learnN * m));
    drawPicture(picEl, learnN, learnM);
    renderList();
  }

  // ---------- practice ----------
  const ROUND = 10;
  const quiz = document.getElementById("quiz");
  let picked = new Set(store.get("picked", [2, 3, 4, 5]));
  let pracMax = store.get("pracMax", 10);
  let state = null;

  function renderSetup() {
    state = null;
    quiz.replaceChildren();
    const s = el("div", "setup");
    s.appendChild(el("div", "label", "Które liczby ćwiczymy?"));
    const nums = el("div", "nums");
    for (let n = 1; n <= 20; n++) {
      const b = el("button", null, n);
      b.id = "pick-" + n;
      b.setAttribute("aria-pressed", picked.has(n));
      b.onclick = () => { picked.has(n) ? picked.delete(n) : picked.add(n); store.set("picked", [...picked]); b.setAttribute("aria-pressed", picked.has(n)); startBtn.disabled = picked.size === 0; startBtn.style.opacity = picked.size ? 1 : .4; };
      nums.appendChild(b);
    }
    s.appendChild(nums);

    const quick = el("div", "quick");
    [["1–5", 1, 5], ["1–10", 1, 10], ["11–20", 11, 20], ["Wszystkie", 1, 20], ["Wyczyść", 0, -1]].forEach(([t, a, z]) => {
      const b = el("button", null, t);
      b.onclick = () => { picked = new Set(); for (let n = a; n <= z; n++) picked.add(n); store.set("picked", [...picked]); renderSetup(); };
      quick.appendChild(b);
    });
    s.appendChild(quick);

    const bar = el("div", "bar");
    bar.appendChild(el("span", "note", "Mnożymy przez"));
    const seg = el("div", "seg");
    [10, 20].forEach(m => {
      const b = el("button", null, "1–" + m);
      b.id = "prac-max-" + m;
      b.setAttribute("aria-pressed", pracMax === m);
      b.onclick = () => { pracMax = m; store.set("pracMax", m); seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); };
      seg.appendChild(b);
    });
    bar.appendChild(seg);
    s.appendChild(bar);
    quiz.appendChild(s);

    const startBtn = el("button", "big-btn", "Start ▶");
    startBtn.disabled = picked.size === 0; startBtn.style.opacity = picked.size ? 1 : .4;
    startBtn.onclick = newRound;
    quiz.appendChild(startBtn);
    const best = store.get("best", null);
    if (best !== null) quiz.appendChild(el("p", "note", "Najlepszy wynik: " + best + " / " + ROUND));
  }

  function newRound() {
    const pool = [];
    picked.forEach(a => { for (let b = 1; b <= pracMax; b++) pool.push([a, b]); });
    // fewer trivial ×1 and ×10 questions
    const weighted = pool.filter(([a, b]) => !(b === 1 || b === 10) || Math.random() < 0.35);
    let qs = shuffle(weighted.length >= ROUND ? weighted : pool);
    while (qs.length < ROUND) qs = qs.concat(shuffle(pool));
    qs = qs.slice(0, ROUND).map(([a, b]) => Math.random() < 0.5 ? [a, b] : [b, a]);
    state = { qs, i: 0, res: [], wrong: [] };
    renderQuestion();
  }

  function progressEl() {
    const d = el("div", "progress");
    for (let i = 0; i < ROUND; i++) {
      const s = el("span");
      if (i < state.res.length) s.className = state.res[i] ? "ok" : "no";
      else if (i === state.i) s.className = "now";
      d.appendChild(s);
    }
    return d;
  }

  let keyHandler = null;
  function renderQuestion() {
    const [a, b] = state.qs[state.i];
    const correct = a * b;
    let typed = "";
    let done = false;
    quiz.replaceChildren();
    quiz.appendChild(progressEl());

    const card = el("div", "q");
    const task = el("div", "task");
    const box = el("span", "answer-box empty", "?");
    task.append(el("span", "c-a", a), el("span", "op", "×"), el("span", "c-b", b), el("span", "op", "="), box);
    const fb = el("div", "feedback");
    card.append(task, fb);
    quiz.appendChild(card);

    const pad = el("div", "keypad");
    const keys = {};
    ["1","2","3","4","5","6","7","8","9","del","0","ok"].forEach(k => {
      const btn = el("button", k === "ok" ? "ok-key" : k === "del" ? "del-key" : null, k === "del" ? "⌫" : k === "ok" ? "OK" : k);
      btn.id = "key-" + k;
      btn.onclick = () => press(k);
      keys[k] = btn;
      pad.appendChild(btn);
    });
    quiz.appendChild(pad);

    const next = el("button", "big-btn", state.i === ROUND - 1 ? "Zobacz wynik →" : "Dalej →");
    next.hidden = true;
    next.onclick = goNext;
    quiz.appendChild(next);

    function show() {
      box.textContent = typed || "?";
      box.classList.toggle("empty", !typed);
    }
    function press(k) {
      if (done) { if (k === "ok") goNext(); return; }
      if (k === "del") typed = typed.slice(0, -1);
      else if (k === "ok") { if (typed) check(); return; }
      else if (typed.length < 3) typed = (typed === "0" ? "" : typed) + k;
      show();
    }
    function check() {
      done = true;
      const ok = Number(typed) === correct;
      state.res.push(ok);
      Object.entries(keys).forEach(([k, btn]) => { if (k !== "ok") btn.disabled = true; });
      if (ok) {
        box.classList.add("ok");
        fb.textContent = ["Brawo!", "Super!", "Świetnie!", "Tak jest!"][Math.floor(Math.random() * 4)];
        fb.className = "feedback ok";
        ding();
      } else {
        box.classList.add("no");
        state.wrong.push([a, b]);
        fb.textContent = "Prawie! " + a + " × " + b + " = " + correct;
        fb.className = "feedback no";
        card.classList.add("shake");
        bonk();
        const help = el("div", "help");
        const small = Math.min(a, b), big = Math.max(a, b);
        if (small > 1) {
          help.append(document.createTextNode("Podpowiedź: "), el("b", null, big + " × " + (small - 1) + " = " + big * (small - 1)), document.createTextNode(", dodaj jeszcze " + big + " i masz "), el("b", "c-res", String(correct)), document.createTextNode("."));
        } else {
          help.append(document.createTextNode("Razy 1 to ta sama liczba: "), el("b", "c-res", String(correct)), document.createTextNode("."));
        }
        card.appendChild(help);
        if (a * b <= 200) { const pic = el("div", "picture"); pic.style.border = "0"; pic.style.padding = "4px 0 0"; card.appendChild(pic); drawPicture(pic, a, b); }
      }
      next.hidden = false;
      quiz.firstChild.replaceWith(progressEl());
    }
    function goNext() {
      state.i++;
      state.i >= ROUND ? renderResult() : renderQuestion();
    }
    if (keyHandler) document.removeEventListener("keydown", keyHandler);
    keyHandler = e => {
      if (secP.hidden) return;
      if (/^[0-9]$/.test(e.key)) press(e.key);
      else if (e.key === "Backspace") press("del");
      else if (e.key === "Enter") { e.preventDefault(); press("ok"); }
    };
    document.addEventListener("keydown", keyHandler);
  }

  function renderResult() {
    if (keyHandler) { document.removeEventListener("keydown", keyHandler); keyHandler = null; }
    const score = state.res.filter(Boolean).length;
    const best = Math.max(store.get("best", 0), score);
    store.set("best", best);
    quiz.replaceChildren();
    const r = el("div", "q result");
    r.appendChild(el("div", "score", score + " / " + ROUND));
    const stars = el("div", "stars");
    for (let i = 0; i < ROUND; i++) stars.appendChild(el("span", i < score ? null : "off", "★"));
    r.appendChild(stars);
    r.appendChild(el("div", "msg", score === ROUND ? "Perfekcyjnie!" : score >= 7 ? "Super!" : score >= 4 ? "Dobrze idzie!" : "Poćwiczmy jeszcze!"));
    if (state.wrong.length) {
      const rev = el("div", "review");
      rev.appendChild(el("div", "label", "Do powtórki"));
      const list = el("div", "skip");
      state.wrong.forEach(([a, b]) => list.appendChild(el("span", null, a + " × " + b + " = " + a * b)));
      rev.appendChild(list);
      r.appendChild(rev);
    }
    r.appendChild(el("p", "note", "Najlepszy wynik: " + best + " / " + ROUND));
    quiz.appendChild(r);
    const again = el("button", "big-btn", "Jeszcze raz");
    again.onclick = newRound;
    const change = el("button", "big-btn ghost", "Zmień liczby");
    change.onclick = renderSetup;
    quiz.append(again, change);
    if (score >= 7) ding();
  }

  renderLearn();
  renderSetup();
  showTab(store.get("tab", "learn"));
  window.addEventListener("resize", () => drawPicture(picEl, learnN, learnM));
})();
</script>

</body>
</html>

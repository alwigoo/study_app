<style>
/* Each "floor" of operations has one colour + one animal, used everywhere:
   brackets = purple gift, powers = pink rocket, · : = orange elephant, + − = blue mouse */
:root {
  --bg: #EEF3FA; --card: #FFFFFF; --ink: #1B2540; --muted: #5B6785; --line: #D6DEEC;
  --par: #7B4FD0; --par-soft: #ECE4FB;
  --pow: #C0347A; --pow-soft: #FBE1EE;
  --md: #D2621C;  --md-soft: #FDEBDD;
  --pm: #2F5FD0;  --pm-soft: #E0E8FA;
  --res: #1E8A5F; --res-soft: #DDF3E9;
  --bad: #D0392F; --bad-soft: #FBE3E1;
  --grid: #E3EAF5;
  --on-color: #FFFFFF;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Lexend", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121827; --card: #1C2438; --ink: #EDF1F9; --muted: #9AA6C2; --line: #2C3752;
    --par: #B596FF; --par-soft: #2A2145;
    --pow: #FF7DB8; --pow-soft: #3B1A2C;
    --md: #FF9B5C;  --md-soft: #3A2618;
    --pm: #86A7FF;  --pm-soft: #1C2A4E;
    --res: #4FCB95; --res-soft: #173327;
    --bad: #FF7A70; --bad-soft: #3B1D1D;
    --grid: #232C43;
    --on-color: #121827;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121827; --card: #1C2438; --ink: #EDF1F9; --muted: #9AA6C2; --line: #2C3752;
  --par: #B596FF; --par-soft: #2A2145;
  --pow: #FF7DB8; --pow-soft: #3B1A2C;
  --md: #FF9B5C;  --md-soft: #3A2618;
  --pm: #86A7FF;  --pm-soft: #1C2A4E;
  --res: #4FCB95; --res-soft: #173327;
  --bad: #FF7A70; --bad-soft: #3B1D1D;
  --grid: #232C43;
  --on-color: #121827;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-inline: 16px; -webkit-tap-highlight-color: transparent;
  font-variant-numeric: tabular-nums;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 3px solid var(--pm); outline-offset: 2px; }
.app { max-width: 520px; margin: 0 auto; padding-block: 14px 40px; display: flex; flex-direction: column; gap: 16px; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 38px; line-height: 1; margin: 0; white-space: nowrap; }
.sub { font-size: 14px; color: var(--muted); padding-bottom: 4px; text-align: right; }
.c-par { color: var(--par); } .c-pow { color: var(--pow); } .c-md { color: var(--md); } .c-pm { color: var(--pm); } .c-res { color: var(--res); } .c-bad { color: var(--bad); }

.tabs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.45fr) minmax(0, 1fr); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 4px; gap: 4px; }
.tabs button { font-family: var(--font-display); font-weight: 800; font-size: 17px; white-space: nowrap; padding: 8px 0 6px; border-radius: 12px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }

.label { font-family: var(--font-display); font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
.note { color: var(--muted); font-size: 14px; margin: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card h3 { font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1.1; margin: 0; display: flex; align-items: center; gap: 10px; }
.card h3 .em { font-size: 30px; }
.card p { margin: 0; }

/* ladder of floors */
.ladder { display: flex; flex-direction: column; gap: 6px; }
.floor { display: grid; grid-template-columns: 34px 46px 1fr; align-items: center; gap: 10px; border-radius: 14px; padding: 8px 12px; background: var(--soft); border-left: 6px solid var(--c); }
.floor .n { font-family: var(--font-display); font-weight: 800; font-size: 22px; color: var(--c); text-align: center; }
.floor .em { font-size: 34px; line-height: 1; text-align: center; }
.floor .t { font-family: var(--font-display); font-weight: 800; font-size: 20px; line-height: 1.1; }
.floor .t small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 13px; color: var(--muted); }
.f-par { --c: var(--par); --soft: var(--par-soft); }
.f-pow { --c: var(--pow); --soft: var(--pow-soft); }
.f-md  { --c: var(--md);  --soft: var(--md-soft); }
.f-pm  { --c: var(--pm);  --soft: var(--pm-soft); }
.lr { display: flex; align-items: center; gap: 10px; background: var(--res-soft); border-radius: 14px; padding: 8px 12px; font-size: 15px; }
.lr .em { font-size: 28px; }

/* expressions */
.expr { font-family: var(--font-display); font-weight: 800; line-height: 1; white-space: nowrap; display: flex; align-items: baseline; gap: .18em; }
.expr .num { color: var(--ink); }
.expr .p { color: var(--par); }
.expr sup { color: var(--pow); font-size: .62em; margin-left: -.12em; position: relative; top: -.6em; line-height: 1; }
.expr .op { color: var(--muted); }
.expr .op.l3 { color: var(--pow); } .expr .op.l2 { color: var(--md); } .expr .op.l1 { color: var(--pm); }
.expr .hl { background: var(--res-soft); border-radius: .2em; box-shadow: 0 0 0 .08em var(--res-soft); }
.expr .eq { color: var(--muted); margin-right: .1em; }
.expr .grp { display: inline-flex; align-items: baseline; gap: .18em; }
button.opb { font-family: var(--font-display); font-weight: 800; position: relative; min-width: 1.15em; padding: .12em .14em .02em; border-radius: .22em; border: 2px dashed var(--line); line-height: 1; color: inherit; }
button.opb:active { transform: scale(.94); }
button.opb.wrong { border-color: var(--bad); border-style: solid; background: var(--bad-soft); }
button.opb[data-e]::after { content: attr(data-e); position: absolute; left: 50%; top: -1.05em; transform: translateX(-50%); font-size: 15px; line-height: 1; }
.expr.picking { padding-top: 22px; }

/* notebook */
.notebook { border-radius: 16px; border: 1px solid var(--line); padding: 14px 12px; display: flex; flex-direction: column; gap: 10px;
  background-color: var(--card);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 18px 18px; overflow: hidden; }
.notebook .line { font-size: 26px; }
.notebook .line.past { opacity: .75; }
.notebook .line.cur { font-size: 44px; }
.notebook .line.done .num { color: var(--res); }
.ex-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.chip-btn { font-family: var(--font-display); font-weight: 800; font-size: 17px; padding: 7px 14px 5px; border-radius: 12px; background: var(--ink); color: var(--bg); }
.chip-btn.ghost { background: var(--card); color: var(--ink); border: 2px solid var(--line); }
.chip-btn:disabled { opacity: .35; cursor: default; }
.say { font-size: 15px; min-height: 22px; }
.say b { font-family: var(--font-display); font-size: 18px; }

.trap { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: baseline; font-size: 15px; }
.trap .expr { font-size: 26px; grid-column: 1 / -1; margin-top: 6px; }
.trap .mark { font-size: 20px; }

/* practice */
.levels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.levels button { display: flex; align-items: center; gap: 10px; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.levels button .em { font-size: 28px; line-height: 1; }
.levels button .t { font-family: var(--font-display); font-weight: 800; font-size: 19px; line-height: 1.05; }
.levels button .t small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); }
.levels button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.levels button[aria-pressed="true"] .t small { color: var(--bg); opacity: .8; }
.levels button.wide { grid-column: 1 / -1; }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.toggle input { width: 20px; height: 20px; accent-color: var(--md); }

.progress { display: flex; gap: 5px; }
.progress span { flex: 1; height: 8px; border-radius: 4px; background: var(--line); }
.progress span.ok { background: var(--res); } .progress span.no { background: var(--md); } .progress span.now { background: var(--muted); }

.instr { font-family: var(--font-display); font-weight: 800; font-size: 21px; line-height: 1.2; min-height: 52px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.instr .expr { font-size: 26px; }
.instr.bad { color: var(--bad); }
.instr.ok { color: var(--res); }
.answer-box { display: inline-block; min-width: 2.2ch; padding: 0 6px; border-bottom: 4px solid var(--muted); color: var(--ink); text-align: center; }
.answer-box.empty { color: var(--line); }
.answer-box.ok { color: var(--res); border-color: var(--res); }
.answer-box.no { color: var(--bad); border-color: var(--bad); text-decoration: line-through; }
.help { width: 100%; background: var(--md-soft); border-radius: 14px; padding: 10px 12px; font-size: 15px; }
.help.good { background: var(--res-soft); }

.keypad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.keypad button { font-family: var(--font-display); font-weight: 800; font-size: 28px; padding: 10px 0 6px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 3px 0 var(--line); }
.keypad button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.keypad .ok-key { background: var(--res); border-color: var(--res); color: var(--on-color); box-shadow: 0 3px 0 rgba(0,0,0,.2); }
.keypad .del-key { color: var(--muted); }
.keypad button:disabled { opacity: .3; cursor: default; }

.big-btn { display: flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--font-display); font-weight: 800; font-size: 20px; padding: 12px 16px 10px; border-radius: 16px; background: var(--ink); color: var(--bg); width: 100%; }
.big-btn.ghost { background: var(--card); color: var(--ink); border: 2px solid var(--line); }
.big-btn:active { transform: scale(.98); }
.big-btn:disabled { opacity: .35; cursor: default; }

.result { text-align: center; align-items: center; }
.result .score { font-family: var(--font-display); font-weight: 800; font-size: 60px; line-height: 1; }
.result .big-em { font-size: 64px; line-height: 1; }
.stars { font-size: 26px; letter-spacing: 2px; color: var(--md); word-break: break-all; }
.stars .off { color: var(--line); }
.result .msg { font-family: var(--font-display); font-weight: 800; font-size: 26px; }

@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
.shake { animation: shake .35s; }
@keyframes pop { 0%{transform:scale(.6);opacity:0} 100%{transform:scale(1);opacity:1} }
.pop { animation: pop .25s ease-out; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

  <header>
    <h1>2 <span class="c-pm">+</span> 3 <span class="c-md">·</span> 4</h1>
    <div class="sub">kolejność<br>wykonywania działań</div>
  </header>

  <nav class="tabs" role="tablist">
    <button id="tab-learn" role="tab" aria-selected="true">Zasady</button>
    <button id="tab-step" role="tab" aria-selected="false">Krok po kroku</button>
    <button id="tab-test" role="tab" aria-selected="false">Test</button>

  <section id="learn" style="display:flex;flex-direction:column;gap:14px"></section>
  <section id="practice" hidden style="flex-direction:column;gap:14px"></section>
</div>

<script>
(function () {
  "use strict";
  const store = {
    get(k, d) { try { const v = localStorage.getItem("kd-" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("kd-" + k, JSON.stringify(v)); } catch (e) {} }
  };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];

  // ---------- sounds ----------
  let actx = null;
  function tones(freqs, dur, type) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      let t = actx.currentTime;
      freqs.forEach(f => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = type; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
        t += dur * 0.8;
      });
    } catch (e) {}
  }
  const ding = () => tones([660, 880], 0.16, "sine");
  const tick = () => tones([520], 0.08, "sine");
  const bonk = () => tones([200, 160], 0.18, "triangle");
  const fanfare = () => tones([523, 659, 784, 1046], 0.16, "triangle");

  // ================= expression engine =================
  // tokens: {t:"n", v}  {t:"o", v:"+"|"-"|"*"|"/"}  {t:"w", v:2|3} (power)  {t:"("}  {t:")"}
  const LEVEL = { "+": 1, "-": 1, "*": 2, "/": 2 };
  const SYM = { "+": "+", "-": "−", "*": "·", "/": ":" };
  const EMOJI = { 1: "🐭", 2: "🐘", 3: "🚀" };
  const lvl = tk => tk.t === "w" ? 3 : tk.t === "o" ? LEVEL[tk.v] : 0;
  const isOp = tk => tk && (tk.t === "o" || tk.t === "w");

  function parse(str, vals) {
    const out = [];
    for (let i = 0; i < str.length; i++) {
      const c = str[i];
      if (c === " ") continue;
      if (/[0-9]/.test(c)) { let j = i; while (j < str.length && /[0-9]/.test(str[j])) j++; out.push({ t: "n", v: Number(str.slice(i, j)) }); i = j - 1; }
      else if (/[a-e]/.test(c)) out.push({ t: "n", v: vals[c] });
      else if ("+-*/".includes(c)) out.push({ t: "o", v: c });
      else if (c === "^") { out.push({ t: "w", v: Number(str[i + 1]) }); i++; }
      else if (c === "(" || c === ")") out.push({ t: c });
    }
    return out;
  }

  // innermost bracket groups (contain no other brackets); whole expression if no brackets
  function scopes(tks) {
    const res = [], stack = [];
    tks.forEach((tk, i) => {
      if (tk.t === "(") stack.push(i);
      else if (tk.t === ")") {
        const j = stack.pop();
        let inner = false;
        for (let m = j + 1; m < i; m++) if (tks[m].t === "(" || tks[m].t === ")") inner = true;
        if (!inner) res.push([j, i]);
      }
    });
    if (!tks.some(tk => tk.t === "(")) res.push([-1, tks.length]);
    return res;
  }
  // all operator indices that may be done right now (canonical = first)
  function validOps(tks) {
    const ok = [];
    scopes(tks).forEach(([l, r]) => {
      let maxL = 0;
      for (let k = l + 1; k < r; k++) maxL = Math.max(maxL, lvl(tks[k]));
      for (let k = l + 1; k < r; k++) {
        const tk = tks[k];
        if (!isOp(tk) || lvl(tk) !== maxL) continue;
        if (tk.t === "o" && k - 2 > l && isOp(tks[k - 2]) && lvl(tks[k - 2]) === maxL) continue; // same floor: left to right
        ok.push(k);
      }
    });
    return ok;
  }
  function whyWrong(tks, k) {
    const sc = scopes(tks).find(([l, r]) => k > l && k < r);
    if (!sc) return { msg: "Najpierw to, co w nawiasie!", em: "🎁" };
    let maxL = 0;
    for (let m = sc[0] + 1; m < sc[1]; m++) maxL = Math.max(maxL, lvl(tks[m]));
    if (lvl(tks[k]) < maxL) {
      if (maxL === 3) return { msg: "Najpierw potęga — rakieta startuje pierwsza!", em: "🚀" };
      return { msg: "Najpierw mnożenie i dzielenie — słonie przed myszkami!", em: "🐘" };
    }
    return { msg: "Takie same zwierzaki — liczymy od lewej, jak czytasz!", em: "📖" };
  }
  function range(tks, k) { return tks[k].t === "w" ? [k - 1, k] : [k - 1, k + 1]; }
  function calc(tks, k) {
    const tk = tks[k];
    if (tk.t === "w") return Math.pow(tks[k - 1].v, tk.v);
    const a = tks[k - 1].v, b = tks[k + 1].v;
    switch (tk.v) { case "+": return a + b; case "-": return a - b; case "*": return a * b; case "/": return b === 0 ? NaN : a / b; }
  }
  // apply op k; returns {tks, value, removedBrackets}
  function apply(tks, k, value) {
    const [a, b] = range(tks, k);
    let out = tks.slice(0, a).concat([{ t: "n", v: value }], tks.slice(b + 1));
    let removed = false, again = true;
    while (again) {
      again = false;
      for (let i = 0; i + 2 < out.length; i++) {
        if (out[i].t === "(" && out[i + 1].t === "n" && out[i + 2].t === ")") { out.splice(i + 2, 1); out.splice(i, 1); removed = again = true; break; }
      }
    }
    return { tks: out, removed };
  }
  // full canonical solution; null if any step is not a nice whole number
  function solve(tks, cap) {
    const steps = [];
    let cur = tks;
    let guard = 0;
    while (!(cur.length === 1 && cur[0].t === "n")) {
      if (guard++ > 30) return null;
      const ops = validOps(cur);
      if (!ops.length) return null;
      const k = ops[0];
      const v = calc(cur, k);
      if (!Number.isInteger(v) || v <= 0 || v > cap) return null;
      if (cur[k].t === "o" && cur[k].v === "/" && cur[k + 1].v < 2) return null;
      if (cur[k].t === "w" && cur[k - 1].v < 2) return null;
      const nx = apply(cur, k, v);
      steps.push({ tks: cur, k, v });
      cur = nx.tks;
    }
    return { steps, value: cur[0].v };
  }
  // what you get by going strictly left to right (ignoring the floors) — the classic mistake
  function naive(tks) {
    let i = 0;
    function term() {
      let v;
      if (tks[i].t === "(") { i++; v = seq(); i++; } else { v = tks[i].v; i++; }
      while (i < tks.length && tks[i].t === "w") { v = Math.pow(v, tks[i].v); i++; }
      return v;
    }
    function seq() {
      let v = term();
      while (i < tks.length && tks[i].t === "o") {
        const op = tks[i].v; i++;
        const w = term();
        v = op === "+" ? v + w : op === "-" ? v - w : op === "*" ? v * w : v / w;
      }
      return v;
    }
    return seq();
  }

  // ---------- task generator ----------
  const LEVELS = [
    { id: "pm", em: "🐭", t: "+ i −", s: "dodawanie, odejmowanie", T: [
      ["a+b-c", { a: [10, 60], b: [2, 30], c: [2, 40] }], ["a-b+c", { a: [15, 70], b: [2, 30], c: [2, 30] }],
      ["a-b-c", { a: [30, 90], b: [2, 30], c: [2, 30] }], ["a+b-c+d", { a: [5, 40], b: [2, 30], c: [2, 40], d: [2, 20] }],
      ["a-b+c-d", { a: [20, 80], b: [2, 30], c: [2, 30], d: [2, 30] }] ] },

  const DEF_RANGE = [2, 9];

  function genOne(levelIds) {
    for (let attempt = 0; attempt < 50; attempt++) {
      const want = pick(levelIds), L = LEVELS.find(x => x.id === want);
      const [tpl, ranges] = pick(L.T);
      for (let tries = 0; tries < 400; tries++) {
        const vals = {};
        "abcde".split("").forEach(ch => { const r = ranges[ch] || DEF_RANGE; vals[ch] = rnd(r[0], r[1]); });
        const tks = parse(tpl, vals);
        const sol = solve(tks, 400);
        if (sol && sol.value <= 300) return { tks, sol, level: L.id };
      }
    }
    const tks = parse("2+3*4", {});
    return { tks, sol: solve(tks, 400), level: "md" };

  function genSet(levelIds, n) {

      if (seen.has(key)) continue;
      seen.add(key); out.push(q);
    }
    return out;
  }

        c.mistakes++; c.tries++; bonk();
        box.classList.add("no"); box.parentElement.classList.add("shake");
        if (c.tries >= 2) {
          c.msg = { msg: "Wynik to " + v + ". Wpisz " + v + " i lecimy dalej!" };
        } else {
          const tk = c.tks[c.k];
          c.msg = { msg: tk.t === "w" ? "Jeszcze raz! Pomnóż liczbę przez siebie." : "Jeszcze raz, spokojnie 🙂" };
        }
        c.typed = "";
        setTimeout(renderStep, 450);
        return;
      } else if (c.typed.length < 4) c.typed = (c.typed === "0" ? "" : c.typed) + k;
      box.textContent = c.typed || "?";
      box.classList.toggle("empty", !c.typed);
    }
  }

  // ---------- test mode ----------
  function renderTest() {
    const q = state.qs[state.i];
    let typed = "", done = false;
    prac.replaceChildren(progressEl());
    const card = el("div", "card");
    card.style.alignItems = "center";
    const line = renderExpr(q.tks);
    line.appendChild(el("span", "op", "="));
    const box = el("span", "answer-box empty", "?");
    box.id = "answer";
    line.appendChild(box);
    card.appendChild(line);
    const fb = el("div", "instr");
    fb.id = "instr";
    card.appendChild(fb);
    prac.appendChild(card);
    const pad = keypad(press);
    prac.appendChild(pad);
    const next = el("button", "big-btn", state.i === state.qs.length - 1 ? "Zobacz wynik →" : "Dalej →");
    next.id = "next"; next.hidden = true;
    next.onclick = goNext;
    prac.appendChild(next);
    requestAnimationFrame(() => fit(line, 46, 22));

    function press(k) {
      if (done) { if (k === "ok") goNext(); return; }
      if (k === "del") typed = typed.slice(0, -1);
      else if (k === "ok") { if (typed) check(); return; }
      else if (typed.length < 4) typed = (typed === "0" ? "" : typed) + k;
      box.textContent = typed || "?";
      box.classList.toggle("empty", !typed);
    }
    function check() {
      done = true;
      const ans = Number(typed), ok = ans === q.sol.value;
      state.res.push(ok);
      pad.setEnabled(false);
      pad.querySelector(".ok-key").disabled = false;
      prac.firstChild.replaceWith(progressEl());
      if (ok) {
        box.classList.add("ok");
        fb.className = "instr ok";
        fb.textContent = pick(["Brawo! 🎉", "Super! 🌟", "Świetnie! 🐘", "Tak jest! ✅"]);
        ding();
        setTimeout(() => { if (state && state.qs[state.i] === q) goNext(); }, 1100);
      } else {
        box.classList.add("no");
        card.classList.add("shake");
        bonk();
        fb.className = "instr bad";
        fb.textContent = "Prawie! Dobry wynik to " + q.sol.value;
        const nv = naive(q.tks);
        const help = el("div", "help");
        if (ans === nv && nv !== q.sol.value) help.textContent = "🪤 Liczyłeś po kolei od lewej. Pamiętaj o piętrach: nawias → potęga → słonie 🐘 → myszki 🐭!";
        else help.textContent = "Zobacz, jak to policzyć krok po kroku:";
        card.appendChild(help);
        const nb = notebook(q.tks, q.sol, q.sol.steps.length);
        // highlight what was computed in each line
        nb.replaceChildren();
        const lines = q.sol.steps.map(s => s.tks);
        lines.forEach((tks, i) => { const l = renderExpr(tks, { hl: range(tks, q.sol.steps[i].k), eq: i > 0 }); l.classList.add("line"); nb.appendChild(l); });
        const last = renderExpr([{ t: "n", v: q.sol.value }], { eq: true }); last.classList.add("line", "done"); nb.appendChild(last);
        nb.style.width = "100%";
        card.appendChild(nb);
        requestAnimationFrame(() => nb.querySelectorAll(".line").forEach(n => fit(n, 28, 16)));
        next.hidden = false;
      }
    }
    function goNext() {
      if (!state || state.qs[state.i] !== q) return;
      state.i++;
      state.i >= state.qs.length ? renderResult() : renderTest();
    }
  }

  // ---------- result ----------
  function renderResult() {
    unbindKeys();
    const n = state.qs.length;
    const score = state.res.filter(Boolean).length;
    const best = Math.max(store.get("best-" + mode, 0), score);
    store.set("best-" + mode, best);
    prac.replaceChildren();
    const r = el("div", "card result");
    r.id = "result";
    r.appendChild(el("div", "big-em", score === n ? "🏆" : score >= n * 0.7 ? "🐘" : score >= n * 0.4 ? "🐭" : "🎁"));
    r.appendChild(el("div", "score", score + " / " + n));
    const stars = el("div", "stars");
    for (let i = 0; i < n; i++) stars.appendChild(el("span", state.res[i] ? null : "off", "★"));
    r.appendChild(stars);
    r.appendChild(el("div", "msg", score === n ? "Mistrz kolejności!" : score >= n * 0.7 ? "Super!" : score >= n * 0.4 ? "Dobrze idzie!" : "Poćwiczmy jeszcze!"));
    r.appendChild(el("p", "note", mode === "step" ? "Gwiazdka = przykład bez żadnej pomyłki." : "Gwiazdka = dobry wynik."));
    if (score < n * 0.4) r.appendChild(el("p", "note", "Zajrzyj do zakładki Zasady i zobacz przykłady krok po kroku."));
    r.appendChild(el("p", "note", "Najlepszy wynik: " + best + " / " + n));
    prac.appendChild(r);
    const again = el("button", "big-btn", "Jeszcze raz");
    again.id = "again";
    again.onclick = newRound;
    const change = el("button", "big-btn ghost", "Zmień poziom");
    change.onclick = renderSetup;
    prac.append(again, change);
    score === n ? fanfare() : score >= n * 0.7 && ding();
  }

  // ================= tabs =================
  const tabs = { learn: document.getElementById("tab-learn"), step: document.getElementById("tab-step"), test: document.getElementById("tab-test") };
  function showTab(name) {
    Object.entries(tabs).forEach(([k, b]) => b.setAttribute("aria-selected", k === name));
    learn.hidden = name !== "learn";
    prac.hidden = name === "learn";
    prac.style.display = name === "learn" ? "" : "flex";
    if (name !== "learn" && (mode !== name || !state)) { mode = name; renderSetup(); }
    if (name === "learn") { unbindKeys(); learn.querySelectorAll(".card").forEach(c => c._draw && c._draw()); }
    store.set("tab", name);
  }
  tabs.learn.onclick = () => showTab("learn");
  tabs.step.onclick = () => { if (mode !== "step") state = null; showTab("step"); };
  tabs.test.onclick = () => { if (mode !== "test") state = null; showTab("test"); };

  renderLearn();
  showTab(store.get("tab", "learn"));

  // for automated checks
  window.__kd = { parse, solve, validOps, whyWrong, naive, genSet, genOne, LEVELS, get state() { return state; }, exprText };
})();
</script>

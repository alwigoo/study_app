<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EEF3FA">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Ćwiczymy!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Lexend:wght@400&display=swap">
<style>
:root{--bg:#EEF3FA;--card:#FFFFFF;--ink:#1B2540;--muted:#5B6785;--line:#D6DEEC;--a:#D2621C;--b:#2F5FD0}
@media (prefers-color-scheme:dark){:root{--bg:#121827;--card:#1C2438;--ink:#EDF1F9;--muted:#9AA6C2;--line:#2C3752;--a:#FF9B5C;--b:#86A7FF;color-scheme:dark}}
body{background:var(--bg);color:var(--ink);font-family:"Lexend",system-ui,sans-serif;padding-inline:16px}
.app{max-width:520px;margin:0 auto;padding-block:24px 40px;display:flex;flex-direction:column;gap:14px}
h1{font-family:"Baloo 2","Trebuchet MS",sans-serif;font-size:40px;line-height:1;margin:0 0 6px}
a.tile{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;text-decoration:none;color:var(--ink)}
a.tile:active{transform:scale(.98)}
.ico{font-size:40px;line-height:1}
.t{font-family:"Baloo 2","Trebuchet MS",sans-serif;font-size:26px;font-weight:800;line-height:1.1}
.d{color:var(--muted);font-size:14px}
</style>
<div class="app">
  <h1>Ćwiczymy!</h1>
  <p style="margin:0;color:var(--muted)">Krótkie ćwiczenia z angielskiego i polskiego.<br>Działają na telefonie, bez logowania.</p>
  <a class="tile" href="to-be.html"><span class="ico">🇬🇧</span><span><span class="t" style="color:var(--b)">to be</span><br><span class="d">am · is · are</span></span></a>
  <a class="tile" href="o-czy-u.html"><span class="ico">✏️</span><span><span class="t" style="color:var(--a)">ó czy u?</span><br><span class="d">pisownia wyrazów</span></span></a>
</div>
</body>
</html>
